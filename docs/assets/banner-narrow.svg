<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Veilforge, pare-feu de confidentialité local pour le trafic LLM : la valeur sensible devient un jeton réversible avant de partir vers le modèle, puis revient à l'identique dans la réponse.">
  <defs>
    <radialGradient id="glowN" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#91e5be" stop-opacity=".18"/>
      <stop offset="60%" stop-color="#91e5be" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsN" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#293446"/>
    </pattern>
  </defs>

  <rect width="600" height="420" fill="#0c1017"/>
  <rect width="600" height="420" fill="url(#dotsN)" opacity=".5"/>
  <rect width="600" height="420" fill="url(#glowN)"/>

  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="32" y="62" font-size="12" font-weight="700" letter-spacing="3.5" fill="#91e5be">PARE-FEU DE CONFIDENTIALITÉ POUR LLM</text>
    <text x="32" y="132" font-size="56" font-weight="700" letter-spacing="-2" fill="#edf2fa">Veilforge<tspan fill="#91e5be">.</tspan></text>
    <text x="32" y="172" font-size="21" font-weight="600" fill="#edf2fa">Envoyez à l'IA ce qu'elle a</text>
    <text x="32" y="200" font-size="21" font-weight="600" fill="#edf2fa">le droit de voir.</text>
    <text x="32" y="236" font-size="15" fill="#9aa8bc">Des jetons réversibles avant l'envoi,</text>
    <text x="32" y="258" font-size="15" fill="#9aa8bc">les valeurs reviennent dans la réponse.</text>
    <g font-size="12.5" fill="#6d7d92">
      <text x="32" y="288">100 % local · compatible OpenAI · mode strict · Apache-2.0</text>
    </g>
  </g>

  <g transform="translate(32 310)">
    <rect width="536" height="86" rx="14" fill="#131a24" stroke="#293446"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="13">
      <text x="18" y="34" fill="#9aa8bc">Ana · ana@example.com · +33 6 12 34 56 78</text>
      <path d="M18 48 h500" stroke="#293446"/>
      <rect x="14" y="56" width="146" height="22" rx="11" fill="rgba(145,229,190,.14)" stroke="rgba(145,229,190,.4)"/>
      <text x="24" y="72" fill="#91e5be">[[EMAIL_001]]</text>
      <rect x="170" y="56" width="150" height="22" rx="11" fill="rgba(145,229,190,.14)" stroke="rgba(145,229,190,.4)"/>
      <text x="180" y="72" fill="#91e5be">[[PHONE_001]]</text>
      <rect x="330" y="56" width="132" height="22" rx="11" fill="rgba(145,229,190,.14)" stroke="rgba(145,229,190,.4)"/>
      <text x="340" y="72" fill="#91e5be">[[PERSON_001]]</text>
    </g>
  </g>
</svg>
