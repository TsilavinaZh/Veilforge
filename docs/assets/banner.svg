<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Veilforge, pare-feu de confidentialité local pour le trafic LLM : la valeur sensible devient un jeton réversible avant de partir vers le modèle, puis revient à l'identique dans la réponse.">
  <defs>
    <radialGradient id="glow" cx="18%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#91e5be" stop-opacity=".16"/>
      <stop offset="60%" stop-color="#91e5be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#91e5be" stop-opacity="0"/>
      <stop offset="50%" stop-color="#91e5be" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#91e5be" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#293446"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#0c1017"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity=".5"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="318" width="1200" height="2" fill="url(#rule)"/>

  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <text x="72" y="78" font-size="14" font-weight="700" letter-spacing="4.5" fill="#91e5be">PARE-FEU DE CONFIDENTIALITÉ POUR LLM</text>
    <text x="72" y="156" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#edf2fa">Veilforge<tspan fill="#91e5be">.</tspan></text>
    <text x="72" y="204" font-size="25" font-weight="600" letter-spacing="-.5" fill="#edf2fa">Envoyez à l'IA ce qu'elle a le droit de voir.</text>
    <text x="72" y="244" font-size="17" fill="#9aa8bc">Les données sensibles deviennent des jetons réversibles avant de partir,</text>
    <text x="72" y="270" font-size="17" fill="#9aa8bc">puis reviennent à l'identique dans la réponse du modèle.</text>
    <g font-size="13" fill="#6d7d92">
      <text x="72" y="302">100 % local</text>
      <text x="176" y="302">·</text>
      <text x="196" y="302">compatible OpenAI</text>
      <text x="344" y="302">·</text>
      <text x="364" y="302">mode strict</text>
      <text x="464" y="302">·</text>
      <text x="484" y="302">Apache-2.0</text>
    </g>
  </g>

  <!-- panneau : avant / après -->
  <g transform="translate(700 54)">
    <rect width="428" height="212" rx="16" fill="#131a24" stroke="#293446"/>
    <rect width="428" height="40" rx="16" fill="#0f151e"/>
    <rect y="24" width="428" height="16" fill="#0f151e"/>
    <line x1="0" y1="40" x2="428" y2="40" stroke="#293446"/>
    <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#9aa8bc">
      <circle cx="20" cy="20" r="4" fill="#91e5be"/>
      <text x="34" y="24">Ce que vous écrivez</text>
      <text x="300" y="24">Ce que voit le modèle</text>
    </g>

    <g font-family="ui-monospace, Consolas, monospace" font-size="13">
      <text x="20" y="72" fill="#9aa8bc">Contact <tspan fill="#edf2fa">Ana</tspan> au</text>
      <rect x="20" y="82" width="150" height="22" rx="6" fill="rgba(145,229,190,.14)"/>
      <text x="26" y="98" fill="#91e5be">ana@example.com</text>
      <text x="20" y="126" fill="#9aa8bc">ou <tspan fill="#edf2fa">+33 6 12 34 56 78</tspan></text>

      <text x="242" y="72" fill="#9aa8bc">Contact <tspan fill="#edf2fa">[[PERSON_001]]</tspan> au</text>
      <rect x="242" y="82" width="152" height="22" rx="11" fill="rgba(145,229,190,.14)" stroke="rgba(145,229,190,.4)"/>
      <text x="252" y="98" fill="#91e5be">[[EMAIL_001]]</text>
      <text x="242" y="126" fill="#9aa8bc">ou <tspan fill="#edf2fa">[[PHONE_001]]</tspan></text>

      <path d="M196 93 h30 m-8 -7 l8 7 l-8 7" stroke="#91e5be" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <line x1="20" y1="150" x2="408" y2="150" stroke="#293446"/>
    <g font-family="system-ui, 'Segoe UI', sans-serif">
      <text x="20" y="176" font-size="12.5" fill="#9aa8bc">Réponse du modèle restaurée à l'identique,</text>
      <text x="20" y="196" font-size="12.5" fill="#9aa8bc">jetons et valeurs chiffrés dans un coffre de session.</text>
    </g>
  </g>
</svg>
