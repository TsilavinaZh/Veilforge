<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="Illustration : un prompt est analysé, les données sensibles deviennent des jetons avant d'atteindre le modèle">
  <defs>
    <linearGradient id="hglow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91e5be" stop-opacity=".22"/>
      <stop offset="1" stop-color="#91e5be" stop-opacity="0"/>
    </linearGradient>
    <filter id="hshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <circle cx="300" cy="200" r="190" fill="url(#hglow)"/>

  <!-- carte : le prompt -->
  <g filter="url(#hshadow)">
    <rect x="34" y="74" width="360" height="240" rx="16" fill="#131a24" stroke="#293446"/>
    <circle cx="62" cy="104" r="5" fill="#293446"/>
    <circle cx="82" cy="104" r="5" fill="#293446"/>
    <circle cx="102" cy="104" r="5" fill="#293446"/>
    <rect x="60" y="132" width="240" height="9" rx="4.5" fill="#293446"/>
    <rect x="60" y="154" width="300" height="9" rx="4.5" fill="#293446"/>

    <!-- jeton surligné dans la ligne -->
    <rect x="60" y="180" width="164" height="26" rx="7" fill="#91e5be" fill-opacity=".13" stroke="#91e5be" stroke-opacity=".55"/>
    <text x="72" y="198" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#91e5be">[[EMAIL_001]]</text>

    <rect x="232" y="188" width="96" height="9" rx="4.5" fill="#293446"/>
    <rect x="60" y="224" width="210" height="9" rx="4.5" fill="#293446"/>
    <rect x="60" y="246" width="150" height="9" rx="4.5" fill="#293446"/>

    <rect x="60" y="272" width="120" height="24" rx="8" fill="#91e5be"/>
    <text x="120" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10271d">Protéger</text>
  </g>

  <!-- bouclier : le coffre -->
  <g filter="url(#hshadow)">
    <path d="M444 96l72 26v56c0 44-30 78-72 96-42-18-72-52-72-96v-56z" fill="#131a24" stroke="#91e5be" stroke-opacity=".55"/>
    <path d="M444 132l40 14v34c0 26-17 46-40 57-23-11-40-31-40-57v-34z" fill="#91e5be" fill-opacity=".14"/>
    <path d="M426 196l14 14 26-30" fill="none" stroke="#91e5be" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- flux -->
  <path d="M402 196h34" stroke="#91e5be" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
  <path d="M436 188l12 8-12 8" fill="none" stroke="#91e5be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- jetons flottants -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="12">
    <rect x="66" y="344" width="146" height="30" rx="8" fill="#0f151e" stroke="#293446"/>
    <text x="139" y="363" text-anchor="middle" fill="#9aa8bc">[[PHONE_001]]</text>
    <rect x="226" y="358" width="176" height="30" rx="8" fill="#0f151e" stroke="#293446"/>
    <text x="314" y="377" text-anchor="middle" fill="#9aa8bc">[[CREDIT_CARD_001]]</text>
    <rect x="420" y="330" width="118" height="30" rx="8" fill="#0f151e" stroke="#293446"/>
    <text x="479" y="349" text-anchor="middle" fill="#9aa8bc">[[IBAN_001]]</text>
  </g>

  <!-- points de connexion -->
  <g fill="#91e5be">
    <circle cx="66" cy="52" r="4"/>
    <circle cx="512" cy="404" r="4"/>
    <circle cx="40" cy="330" r="4"/>
  </g>
</svg>
